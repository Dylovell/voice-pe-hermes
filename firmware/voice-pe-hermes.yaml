# voice-pe-hermes
# Custom ESPHome firmware for HA Voice Preview Edition that connects
# directly to Hermes Agent via WebSocket, bypassing HA Assist.
#
# Uses the official Voice PE firmware as a base package for hardware
# support (XMOS DSP, DAC, LEDs, buttons, mute, jack, timer), but
# replaces the voice_assistant pipeline with our WebSocket component.

substitutions:
  name: voice-pe-hermes
  friendly_name: "Voice PE Hermes"
  name_add_mac_suffix: true

  # WebSocket server (Hermes VM)
  ws_host: !secret ws_host
  ws_port: "8765"

  # Phase IDs (from stock config, for LED pattern compatibility)
  voice_assist_idle_phase_id: "1"
  voice_assist_listening_phase_id: "3"
  voice_assist_thinking_phase_id: "4"
  voice_assist_replying_phase_id: "5"
  voice_assist_not_ready_phase_id: "10"

packages:
  # Import ALL hardware from the official Voice PE config
  voice_pe: github://esphome/home-assistant-voice-pe/home-assistant-voice.yaml@dev

external_components:
  - source:
      type: local
      path: components/
    components: [web_socket_voice]

# ── Custom WebSocket Voice Component ──────────────────────────────────
web_socket_voice:
  id: ws_voice
  server_host: ${ws_host}
  server_port: ${ws_port}
  microphone: i2s_mics
  speaker: speaker

# ── Voice assistant (disabled) ───────────────────────────────────────
# We keep it for the event hooks (wake word detection and button presses
# call voice_assistant.start:). The on_start handler intercepts and
# routes to our WebSocket component.
voice_assistant:
  on_start:
    - lambda: |-
        id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
        id(ws_voice).start_stream();
    - script.execute: control_leds
  on_end:
    - lambda: |-
        id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds

# ── WiFi ──────────────────────────────────────────────────────────────
wifi:
  ap:
    ssid: "${name} Fallback Hotspot"
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - lambda: |-
        id(init_in_progress) = false;
        id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
    - lambda: |-
        id(mww).start();

# ── OTA and API ───────────────────────────────────────────────────────
ota:
  - platform: esphome

api:
  encryption:
    key: !secret api_encryption_key

# ── Logger ────────────────────────────────────────────────────────────
logger:
  level: DEBUG
  logs:
    web_socket_voice: DEBUG
    sensor: WARN

# ── Web Server (debug) ────────────────────────────────────────────────
web_server:
  port: 80
  local: true

# ── Status LED ────────────────────────────────────────────────────────
status_led:
  pin:
    number: GPIO2
    inverted: true

# ── Text Sensor — connection status ───────────────────────────────────
text_sensor:
  - platform: template
    name: "Voice PE Hermes Status"
    id: hermes_status
    icon: "mdi:voice"
    update_interval: 10s
    lambda: |-
      if (id(ws_voice).is_connected()) {
        return {"connected"};
      } else {
        return {"disconnected"};
      }
