# Voice PE → Hermes Agent
# =========================
# Custom ESPHome firmware for the Home Assistant Voice Preview Edition.
#
# Uses the official Voice PE package for ALL hardware support
# (XMOS DSP, DAC, LEDs, buttons, mute, jack, timer, voice_assistant),
# but adds a WebSocket voice component that streams audio directly
# to the Hermes Agent server — bypassing HA's Assist pipeline.
#
# LED animations: the C++ firmware calls phase-specific LED sub-scripts
# directly (control_leds_voice_assistant_*_phase), bypassing the stock
# control_leds master script.  This is because the master script checks
# api_id.is_connected() and shows a red "no HA" twinkle — we don't have
# HA connected, so the sub-scripts are used instead for proper animations:
#   - Listening: Fast clockwise blue spin
#   - Replying:  Fast counter-clockwise blue spin
#   - Idle:      LEDs off (or user-facing LED ring if enabled)

substitutions:
  name: home-assistant-voice
  friendly_name: Home Assistant Voice

  # WiFi — the stock package expects these from the importing YAML
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

  # Wake word — enable one model
  micro_wake_word_model: okay_nabu

  # Hermes WebSocket server
  ws_host: !secret ws_host
  ws_port: "8765"

  # Phase IDs (must match stock package values)
  voice_assist_idle_phase_id: "1"
  voice_assist_listening_phase_id: "3"
  voice_assist_thinking_phase_id: "4"
  voice_assist_replying_phase_id: "5"
  voice_assist_not_ready_phase_id: "10"

packages:
  # FULL official Voice PE package — all hardware, LEDs, scripts, etc.
  voice_pe: github://esphome/home-assistant-voice-pe/home-assistant-voice.yaml@dev

# Import our custom component (local Python, not YAML)
external_components:
  - source: components/
    components: [web_socket_voice]

# ── Custom WebSocket Voice Component ──────────────────────────────────
# Connects directly to the Hermes server, bypassing HA voice_assistant.
web_socket_voice:
  id: ws_voice
  server_host: ${ws_host}
  server_port: ${ws_port}
  microphone: i2s_mics
  speaker: i2s_audio_speaker

# ── Wake Word ────────────────────────────────────────────────────────
# Override stock micro_wake_word's on_wake_word_detected handler to
# route to ws_voice instead of voice_assistant.start().
micro_wake_word:
  id: mww
  on_wake_word_detected:
    - if:
        condition:
          switch.is_off: master_mute_switch
        then:
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      - voice_assistant.stop:
                    else:
                      - if:
                          condition:
                            media_player.is_announcing:
                              id: external_media_player
                          then:
                            - media_player.stop:
                                announcement: true
                                id: external_media_player
                          else:
                            - if:
                                condition:
                                  switch.is_on: wake_sound
                                then:
                                  - script.execute:
                                      id: play_sound
                                      priority: true
                                      sound_file: "wake_word_triggered_sound"
                                  - delay: 300ms
                      - lambda: |-
                          ESP_LOGD("mww", "Calling start_stream (state=%d)", (int)id(ws_voice).get_state());
                          id(ws_voice).start_stream();
                          ESP_LOGD("mww", "start_stream returned, setting LED");
                          id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
                          id(control_leds_voice_assistant_listening_for_command_phase).execute();
                          ESP_LOGD("mww", "LED set complete");
        else:
          - lambda: |-
              ESP_LOGD("mww", "MUTED — skipping");

# ── WiFi init override ────────────────────────────────────────────────
# The stock package waits for HA API connection to set init_in_progress=false
# and start the wake word. Since we don't use HA API, we must do this ourselves.
# We also bypass the stock control_leds (which shows red due to no HA API)
# and directly set the idle LED phase.
wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  on_connect:
    - lambda: |-
        ESP_LOGI("voice_pe", "WiFi connected — idle LED, wake word active");
        id(init_in_progress) = false;
        id(voice_assistant_phase) = 1;
        id(control_leds_voice_assistant_idle_phase).execute();
    - micro_wake_word.start:

# ── Logging ────────────────────────────────────────────────────────────
logger:
  level: DEBUG
  logs:
    web_socket_voice: DEBUG
    sensor: WARN
